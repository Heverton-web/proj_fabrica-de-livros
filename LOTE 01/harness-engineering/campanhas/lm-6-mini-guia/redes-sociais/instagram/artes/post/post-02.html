<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post Instagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0b0f1a; color: #f5f7ff; overflow: hidden;
  }
  .fundo {
    width: 100%; height: 100%; position: relative; display: flex;
    flex-direction: column; padding: 96px 88px 84px;
    background:
      radial-gradient(1100px 800px at 85% -10%, rgba(224, 93, 93, 0.3), transparent 60%),
      radial-gradient(900px 700px at -10% 110%, rgba(224, 93, 93, 0.3), transparent 55%),
      linear-gradient(160deg, #0b0f1a 0%, #101628 60%, #0b0f1a 100%);
  }
  .fundo::after {
    content: ""; position: absolute; inset: 0; opacity: .14;
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 72px 72px; pointer-events: none;
  }
  .topo { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .colecao { font-size: 30px; letter-spacing: .22em; text-transform: uppercase; opacity: .72; }
  .badge {
    font-size: 28px; font-weight: 700; padding: 14px 34px; border-radius: 999px;
    border: 2px solid #e05d5d; color: #e05d5d; background: rgba(255,255,255,.04);
  }
  .meio { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .titulo { font-size: 84px; line-height: 1.12; font-weight: 800; max-width: 880px; }
  .subtitulo { margin-top: 36px; font-size: 44px; line-height: 1.35; opacity: .85; max-width: 840px; }
  .tags { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 18px; }
  .tag {
    font-size: 30px; padding: 12px 28px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
  }
  .rodape { display: flex; justify-content: space-between; align-items: flex-end; position: relative; }
  .cta {
    font-size: 40px; font-weight: 800; padding: 26px 52px; border-radius: 999px;
    background: linear-gradient(120deg, #e05d5d, #642929); color: #0b0f1a;
  }
  .slug { font-size: 26px; opacity: .5; max-width: 420px; text-align: right; line-height: 1.4; }
</style>
</head>
<body>
  <div class="fundo">
    <div class="topo">
      <div class="colecao">harness-engineering</div>
      <div class="badge">Iniciante</div>
    </div>
    <div class="meio">
      <h1 class="titulo">Mini-guia: Harness Engineering — Do Modelo ao Sistema Autônomo C</h1>
      <p class="subtitulo">harness-engineering</p>
      <div class="tags"><span class="tag">arnês</span><span class="tag">corda</span><span class="tag">ancoragem</span><span class="tag">mosquetão</span></div>
    </div>
    <div class="rodape">
      <div class="cta">Baixe o material gratuito</div>
      <div class="slug">lm-6-mini-guia</div>
    </div>
  </div>
</body>
</html>
