version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Backend — API FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maquina-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/database/leads.db
      - LOG_LEVEL=INFO
    volumes:
      - database_data:/app/database
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - maquina-net

  # ---------------------------------------------------------------------------
  # Frontend — Next.js / React
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maquina-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - maquina-net

  # ---------------------------------------------------------------------------
  # Workers — Scripts Python (lead hunter, email sender, etc)
  # ---------------------------------------------------------------------------
  worker-leads:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: maquina-worker-leads
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WORKER_TYPE=lead_hunter
    volumes:
      - database_data:/app/database
      - ./config:/app/config:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maquina-net

  worker-email:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: maquina-worker-email
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WORKER_TYPE=email_sender
    volumes:
      - database_data:/app/database
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maquina-net

  # ---------------------------------------------------------------------------
  # Monitor — Métricas em tempo real
  # ---------------------------------------------------------------------------
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: maquina-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WORKER_TYPE=funnel_monitor
    volumes:
      - database_data:/app/database
      - ./config:/app/config:ro
    ports:
      - "9090:9090"
    networks:
      - maquina-net

  # ---------------------------------------------------------------------------
  # Nginx — Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: maquina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - maquina-net

volumes:
  database_data:
    driver: local

networks:
  maquina-net:
    driver: bridge
