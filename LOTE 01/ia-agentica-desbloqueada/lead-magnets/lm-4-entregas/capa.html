<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 2480px; height: 3508px;
    background: #0d1117;
    font-family: 'Inter', Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: #f0933b; }
  .bottom-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #f0933b; }
  .content {
    position: absolute; top: 40px; bottom: 40px; left: 80px; right: 80px;
    display: flex; flex-direction: column;
  }
  .header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .editora-icon {
    width: 72px; height: 72px; border: 3px solid #f0933b; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #f0933b; font-weight: 700; font-family: monospace;
  }
  .editora-text { font-size: 24px; font-weight: 600; color: #8b949e; letter-spacing: 4px; text-transform: uppercase; }
  .center {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; min-height: 0;
  }
  .ilustracao { display: flex; align-items: center; justify-content: center; min-height: 0; margin-bottom: 24px; }
  .ilustracao img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .title { font-size: 72px; font-weight: 900; color: #e6edf3; line-height: 1.05; letter-spacing: -1px; margin-bottom: 16px; flex-shrink: 0; }
  .title .highlight { color: #f0933b; }
  .subtitle { font-size: 22px; font-weight: 300; color: #8b949e; margin-bottom: 20px; flex-shrink: 0; }
  .badge { display: inline-block; background: #f0933b; color: #0d1117; padding: 8px 20px; border-radius: 18px; font-weight: 700; font-size: 15px; margin-bottom: 20px; align-self: flex-start; flex-shrink: 0; }
  .divider { width: 80px; height: 4px; background: #f0933b; margin-bottom: 16px; flex-shrink: 0; }
  .footer { flex-shrink: 0; }
  .author-name { font-size: 30px; font-weight: 600; color: #e6edf3; margin-bottom: 4px; }
  .author-role { font-size: 16px; color: #f0933b; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="bottom-bar"></div>
  <div class="content">
    <div class="header">
      <div class="editora-icon">&gt;_</div>
      <div class="editora-text">Editora Agêntica</div>
    </div>
    <div class="center">
      
      <div class="title">MAPA DE ENTREGAS: IA AGÊNTICA <span class="highlight">DESBLOQUEADA</span></div>
      <div class="subtitle">Todos os artefatos que você produz em IA Agêntica Desbloqueada</div>
      <div class="badge">NÍVEL INTERMEDIÁRIO</div>
      <div class="divider"></div>
    </div>
    <div class="footer">
      <div class="author-name">Heverton Eduardo Peres</div>
      <div class="author-role">Especialista em Marketing e Desenvolvimento de Soluções</div>
    </div>
  </div>
</body>
</html>
