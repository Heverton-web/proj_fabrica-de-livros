<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Feed Story Instagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0b0f1a; color: #f5f7ff; overflow: hidden;
  }
  .fundo {
    width: 100%; height: 100%; position: relative; display: flex;
    flex-direction: column; padding: 140px 100px 110px;
    background:
      radial-gradient(1200px 900px at 85% -8%, ${COR_SOFT}, transparent 60%),
      radial-gradient(1000px 800px at -10% 112%, ${COR_SOFT}, transparent 55%),
      linear-gradient(160deg, #0b0f1a 0%, #101628 60%, #0b0f1a 100%);
  }
  .fundo::after {
    content: ""; position: absolute; inset: 0; opacity: .13;
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 80px 80px; pointer-events: none;
  }
  .topo { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .colecao { font-size: 34px; letter-spacing: .22em; text-transform: uppercase; opacity: .72; }
  .badge {
    font-size: 32px; font-weight: 700; padding: 16px 40px; border-radius: 999px;
    border: 2px solid ${COR}; color: ${COR}; background: rgba(255,255,255,.04);
  }
  .meio { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .titulo { font-size: 116px; line-height: 1.1; font-weight: 800; max-width: 860px; }
  .subtitulo { margin-top: 56px; font-size: 60px; line-height: 1.35; opacity: .85; max-width: 850px; }
  .tags { margin-top: 64px; display: flex; flex-wrap: wrap; gap: 22px; }
  .tag {
    font-size: 38px; padding: 16px 36px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
  }
  .rodape { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .cta {
    font-size: 54px; font-weight: 800; padding: 34px 68px; border-radius: 999px;
    background: linear-gradient(120deg, ${COR}, ${COR2}); color: #0b0f1a;
  }
  .slug { font-size: 30px; opacity: .5; max-width: 400px; text-align: right; line-height: 1.4; }
</style>
</head>
<body>
  <div class="fundo">
    <div class="topo">
      <div class="colecao">${COLECAO}</div>
      <div class="badge">${NIVEL}</div>
    </div>
    <div class="meio">
      <h1 class="titulo">${TITULO}</h1>
      <p class="subtitulo">${SUBTITULO}</p>
      <div class="tags">${TAGS}</div>
    </div>
    <div class="rodape">
      <div class="cta">${CTA}</div>
      <div class="slug">${SLUG}</div>
    </div>
  </div>
</body>
</html>
