<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post LinkedIn</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 628px; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0b0f1a; color: #f5f7ff; overflow: hidden;
  }
  .fundo {
    width: 100%; height: 100%; position: relative; display: flex;
    flex-direction: column; padding: 52px 64px 48px;
    background:
      radial-gradient(700px 460px at 88% -20%, rgba(240, 147, 59, 0.3), transparent 60%),
      radial-gradient(600px 420px at -8% 120%, rgba(240, 147, 59, 0.3), transparent 55%),
      linear-gradient(160deg, #0b0f1a 0%, #101628 60%, #0b0f1a 100%);
  }
  .fundo::after {
    content: ""; position: absolute; inset: 0; opacity: .13;
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 64px 64px; pointer-events: none;
  }
  .topo { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .colecao { font-size: 22px; letter-spacing: .22em; text-transform: uppercase; opacity: .72; }
  .badge {
    font-size: 20px; font-weight: 700; padding: 10px 26px; border-radius: 999px;
    border: 2px solid #f0933b; color: #f0933b; background: rgba(255,255,255,.04);
  }
  .meio { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .titulo { font-size: 56px; line-height: 1.14; font-weight: 800; max-width: 980px; }
  .subtitulo { margin-top: 24px; font-size: 30px; line-height: 1.35; opacity: .85; max-width: 920px; }
  .tags { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 14px; }
  .tag {
    font-size: 22px; padding: 9px 22px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
  }
  .rodape { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .cta {
    font-size: 28px; font-weight: 800; padding: 18px 38px; border-radius: 999px;
    background: linear-gradient(120deg, #f0933b, #6c421a); color: #0b0f1a;
  }
  .slug { font-size: 18px; opacity: .5; max-width: 340px; text-align: right; line-height: 1.4; }
</style>
</head>
<body>
  <div class="fundo">
    <div class="topo">
      <div class="colecao">ia-agentica-desbloqueada</div>
      <div class="badge">Intermediario</div>
    </div>
    <div class="meio">
      <h1 class="titulo">Construindo o OrquestraIA</h1>
      <p class="subtitulo">ia-agentica-desbloqueada</p>
      <div class="tags"><span class="tag">agente</span><span class="tag">orquestrador</span><span class="tag">autonomia</span><span class="tag">produção</span></div>
    </div>
    <div class="rodape">
      <div class="cta">Baixe o e-book completo</div>
      <div class="slug">ia-agentica-desbloqueada--eb-03-construindo-o-orquestraia</div>
    </div>
  </div>
</body>
</html>
