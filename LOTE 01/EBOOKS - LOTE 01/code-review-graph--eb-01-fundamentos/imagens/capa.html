<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600,height=2560">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px; height: 2560px;
    background: #0d1117;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: #e6edf3;
    overflow: hidden;
    position: relative;
  }

  /* Grid de fundo sutil */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(88,166,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88,166,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Ilustração: grafo de dependências simplificado */
  .graph-container {
    position: absolute;
    top: 680px; left: 0; width: 100%;
    height: 1100px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .graph-svg {
    width: 1200px;
    height: 900px;
  }

  /* Nodes do grafo */
  .node-rect {
    rx: 8; ry: 8;
    stroke-width: 2;
  }
  .node-text {
    font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 22px;
    fill: #e6edf3;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .node-text-small {
    font-size: 16px;
    fill: #8b949e;
  }

  /* Arestas */
  .edge-line {
    stroke-width: 2.5;
    fill: none;
  }

  /* Glow nos nós centrais */
  .glow-central {
    filter: drop-shadow(0 0 12px rgba(88,166,255,0.4));
  }

  /* Badge do ebook */
  .badge {
    position: absolute;
    top: 80px; right: 80px;
    background: #e94560;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    padding: 12px 32px;
    border-radius: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Título */
  .title-block {
    position: absolute;
    top: 180px; left: 100px;
  }
  .title-main {
    font-size: 108px;
    font-weight: 800;
    line-height: 1.05;
    color: #ffffff;
    letter-spacing: -2px;
    max-width: 1400px;
  }
  .title-sub {
    font-size: 56px;
    font-weight: 300;
    color: #58a6ff;
    margin-top: 20px;
    letter-spacing: 1px;
  }

  /* Linha decorativa */
  .accent-line {
    position: absolute;
    top: 580px; left: 100px;
    width: 200px; height: 4px;
    background: linear-gradient(90deg, #e94560, #58a6ff);
    border-radius: 2px;
  }

  /* Chave "65x" destacado */
  .stat-badge {
    position: absolute;
    top: 600px; left: 100px;
    font-size: 36px;
    color: #7ee787;
    font-weight: 600;
    font-family: 'Fira Code', monospace;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 0; left: 0; width: 100%;
    height: 340px;
    background: linear-gradient(180deg, transparent, rgba(88,166,255,0.06));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 100px 60px;
  }
  .author {
    font-size: 38px;
    font-weight: 400;
    color: #c9d1d9;
    margin-bottom: 12px;
  }
  .publisher {
    font-size: 30px;
    font-weight: 600;
    color: #8b949e;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* Barra lateral decorativa */
  .side-bar {
    position: absolute;
    left: 0; top: 0;
    width: 8px; height: 100%;
    background: linear-gradient(180deg, #e94560, #58a6ff, #7ee787);
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="side-bar"></div>

  <div class="badge">EBOOK</div>

  <div class="title-block">
    <div class="title-main">CODE REVIEW<br>GRAPH</div>
    <div class="title-sub">FUNDAMENTOS</div>
  </div>

  <div class="accent-line"></div>
  <div class="stat-badge">Reducao de 65x em tokens</div>

  <!-- Ilustracao: grafo de dependencias -->
  <div class="graph-container">
    <svg class="graph-svg" viewBox="0 0 1200 900">
      <!-- Arestas -->
      <line class="edge-line" x1="300" y1="200" x2="550" y2="120" stroke="#1f6feb" opacity="0.6"/>
      <line class="edge-line" x1="300" y1="200" x2="520" y2="300" stroke="#1f6feb" opacity="0.5"/>
      <line class="edge-line" x1="300" y1="200" x2="250" y2="380" stroke="#1f6feb" opacity="0.4"/>
      <line class="edge-line" x1="300" y1="200" x2="480" y2="480" stroke="#1f6feb" opacity="0.3"/>

      <line class="edge-line" x1="550" y1="120" x2="800" y2="80" stroke="#388bfd" opacity="0.5"/>
      <line class="edge-line" x1="550" y1="120" x2="750" y2="220" stroke="#388bfd" opacity="0.4"/>
      <line class="edge-line" x1="520" y1="300" x2="750" y2="220" stroke="#388bfd" opacity="0.4"/>
      <line class="edge-line" x1="520" y1="300" x2="700" y2="420" stroke="#388bfd" opacity="0.3"/>
      <line class="edge-line" x1="250" y1="380" x2="520" y2="300" stroke="#388bfd" opacity="0.3"/>

      <line class="edge-line" x1="800" y1="80" x2="1000" y2="140" stroke="#58a6ff" opacity="0.4"/>
      <line class="edge-line" x1="750" y1="220" x2="1000" y2="140" stroke="#58a6ff" opacity="0.3"/>
      <line class="edge-line" x1="750" y1="220" x2="950" y2="320" stroke="#58a6ff" opacity="0.3"/>
      <line class="edge-line" x1="700" y1="420" x2="950" y2="320" stroke="#58a6ff" opacity="0.25"/>
      <line class="edge-line" x1="480" y1="480" x2="700" y2="420" stroke="#388bfd" opacity="0.25"/>

      <line class="edge-line" x1="1000" y1="140" x2="1100" y2="280" stroke="#7ee787" opacity="0.3"/>
      <line class="edge-line" x1="950" y1="320" x2="1100" y2="280" stroke="#7ee787" opacity="0.25"/>
      <line class="edge-line" x1="950" y1="320" x2="1050" y2="460" stroke="#7ee787" opacity="0.2"/>

      <!-- Nodes centrais (vermelho/rosa) -->
      <rect class="node-rect glow-central" x="230" y="165" width="140" height="70" fill="#e94560" stroke="#ff6b81"/>
      <text class="node-text" x="300" y="200">app.py</text>

      <!-- Nodes nivel 1 (azul escuro) -->
      <rect class="node-rect" x="490" y="85" width="120" height="70" fill="#161b22" stroke="#1f6feb"/>
      <text class="node-text" x="550" y="120">views.py</text>

      <rect class="node-rect" x="460" y="265" width="120" height="70" fill="#161b22" stroke="#1f6feb"/>
      <text class="node-text" x="520" y="300">wrappers.py</text>

      <rect class="node-rect" x="190" y="345" width="120" height="70" fill="#161b22" stroke="#1f6feb"/>
      <text class="node-text" x="250" y="380">ctx.py</text>

      <rect class="node-rect" x="420" y="445" width="120" height="70" fill="#161b22" stroke="#1f6feb"/>
      <text class="node-text" x="480" y="480">helpers.py</text>

      <!-- Nodes nivel 2 (azul medio) -->
      <rect class="node-rect" x="740" y="45" width="120" height="70" fill="#0d1117" stroke="#388bfd"/>
      <text class="node-text" x="800" y="80">session.py</text>

      <rect class="node-rect" x="690" y="185" width="120" height="70" fill="#0d1117" stroke="#388bfd"/>
      <text class="node-text" x="750" y="220">blueprints.py</text>

      <rect class="node-rect" x="640" y="385" width="120" height="70" fill="#0d1117" stroke="#388bfd"/>
      <text class="node-text" x="700" y="420">globals.py</text>

      <!-- Nodes nivel 3 (verde escuro) -->
      <rect class="node-rect" x="940" y="105" width="120" height="70" fill="#0d1117" stroke="#238636"/>
      <text class="node-text" x="1000" y="140">cookie.py</text>

      <rect class="node-rect" x="890" y="285" width="120" height="70" fill="#0d1117" stroke="#238636"/>
      <text class="node-text" x="950" y="320">cli.py</text>

      <rect class="node-rect" x="1040" y="245" width="120" height="70" fill="#0d1117" stroke="#238636"/>
      <text class="node-text" x="1100" y="280">test_app.py</text>

      <rect class="node-rect" x="990" y="425" width="120" height="70" fill="#0d1117" stroke="#238636"/>
      <text class="node-text" x="1050" y="460">config.py</text>

      <!-- Labels de profundidade -->
      <text class="node-text node-text-small" x="120" y="60" fill="#e94560" font-weight="700">Alterado</text>
      <text class="node-text node-text-small" x="120" y="85" fill="#1f6feb">Nivel 1</text>
      <text class="node-text node-text-small" x="120" y="110" fill="#388bfd">Nivel 2</text>
      <text class="node-text node-text-small" x="120" y="135" fill="#238636">Nivel 3</text>

      <!-- Pontos coloridos ao lado dos labels -->
      <circle cx="80" cy="56" r="8" fill="#e94560"/>
      <circle cx="80" cy="81" r="8" fill="#1f6feb"/>
      <circle cx="80" cy="106" r="8" fill="#388bfd"/>
      <circle cx="80" cy="131" r="8" fill="#238636"/>
    </svg>
  </div>

  <div class="footer">
    <div class="author">Heverton Eduardo Peres</div>
    <div class="publisher">Editora Agêntica</div>
  </div>
</body>
</html>
