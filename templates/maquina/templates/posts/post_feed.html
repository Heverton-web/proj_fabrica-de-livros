<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Feed — {{TITULO}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .post-card {
      width: 1080px;
      min-height: 1080px;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    .post-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(102,126,234,0.1) 0%, transparent 50%);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .content { position: relative; z-index: 1; text-align: center; }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 8px 24px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .headline {
      font-size: 52px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 25px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .headline span { color: #667eea; }
    .subheadline {
      font-size: 22px;
      color: #b8b8d4;
      line-height: 1.5;
      margin-bottom: 40px;
      max-width: 800px;
    }
    .cta {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 18px 50px;
      border-radius: 50px;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(102,126,234,0.4);
    }
    .logo {
      position: absolute;
      bottom: 40px;
      font-size: 16px;
      color: #666;
      letter-spacing: 2px;
    }
    .corner-deco {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 2px solid rgba(102,126,234,0.2);
    }
    .corner-deco.top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
    .corner-deco.bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }
  </style>
</head>
<body>
  <div class="post-card">
    <div class="corner-deco top-left"></div>
    <div class="corner-deco bottom-right"></div>

    <div class="content">
      <span class="badge">{{CATEGORIA}}</span>

      <h1 class="headline">{{TITULO}}</h1>

      <p class="subheadline">{{SUBTITULO}}</p>

      <span class="cta">{{CTA}}</span>
    </div>

    <span class="logo">{{EMPRESA_NOME}}</span>
  </div>
</body>
</html>
