<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story — Analista Financeiro Futuro Odontologia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .story {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #0f0c29 0%, #302b63 40%, #24243e 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 50px;
      position: relative;
      overflow: hidden;
    }
    .story::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 80%, rgba(102,126,234,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(118,75,162,0.15) 0%, transparent 50%);
    }
    .top { position: relative; z-index: 1; }
    .logo-text {
      font-size: 18px;
      color: #667eea;
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 20px 0;
      border-radius: 2px;
    }
    .middle {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .hashtag {
      display: inline-block;
      background: rgba(102,126,234,0.2);
      color: #667eea;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 25px;
      align-self: flex-start;
    }
    .headline {
      font-size: 56px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 20px;
    }
    .headline span {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .body-text {
      font-size: 22px;
      color: #b8b8d4;
      line-height: 1.6;
      max-width: 900px;
    }
    .bottom {
      position: relative;
      z-index: 1;
    }
    .swipe-cta {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .swipe-cta .arrow {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .swipe-cta .text {
      font-size: 18px;
      color: #fff;
      font-weight: 600;
    }
    .progress-bar {
      display: flex;
      gap: 6px;
    }
    .progress-bar .segment {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }
    .progress-bar .segment.active {
      background: #667eea;
    }
  </style>
</head>
<body>
  <div class="story">
    <div class="top">
      <div class="progress-bar">
        <div class="segment active"></div>
        <div class="segment"></div>
        <div class="segment"></div>
      </div>
      <div style="margin-top: 40px;">
        <span class="logo-text">{{EMPRESA_NOME}}</span>
        <div class="divider"></div>
      </div>
    </div>

    <div class="middle">
      <span class="hashtag">{{HASHTAG}}</span>
      <h1 class="headline">Analista Financeiro Futuro Odontologia</h1>
      <p class="body-text">{{CORPO}}</p>
    </div>

    <div class="bottom">
      <div class="swipe-cta">
        <div class="arrow">↑</div>
        <span class="text">{{CTA}}</span>
      </div>
    </div>
  </div>
</body>
</html>
